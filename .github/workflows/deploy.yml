name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Allows a deploy to be triggered by hand from the Actions tab.
  workflow_dispatch:

# Read the repository, and mint the token the Pages deployment needs.
permissions:
  contents: read
  pages: write
  id-token: write

# A queued run waits for the one in progress rather than cancelling it, so a
# deploy that is already publishing is never interrupted half-way.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # ---------------------------------------------------------------------------
  # WHERE THE SITE IS SERVED FROM.
  #
  # "/" means the site is served at the root of its own domain, which is the
  # arrangement vangmar.pl needs: every legacy URL is an absolute path on that
  # domain, so internal links must carry no prefix. This also makes the build
  # ship CNAME, which is what tells GitHub Pages the custom domain.
  #
  # The alternative is the repository-name prefix "/www.vangmar.pl/", for
  # serving from the github.io project URL instead:
  #
  #     https://vangmar.github.io/www.vangmar.pl/
  #
  # where root-relative paths such as /assets/css/author.css would otherwise
  # 404. In that mode CNAME is withheld, so the custom domain stays unset and
  # the preview is not redirected to a domain that may not point here yet.
  # ---------------------------------------------------------------------------
  PATH_PREFIX: "/"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the site
        run: npm run build

      # CNAME must survive into the published artifact or GitHub Pages drops the
      # custom domain; it is copied from src/ by the Eleventy build, so fail loudly
      # here rather than discovering the domain has reset after deploying.
      # The path prefix and the custom domain are two halves of one decision, so
      # a single setting drives both and they can never disagree:
      #
      #   PATH_PREFIX = "/"          -> custom domain; ship CNAME
      #   PATH_PREFIX = "/<repo>/"   -> github.io project URL; drop CNAME
      #
      # Dropping CNAME while previewing matters: GitHub reads that file from the
      # deployed artifact and switches the site to the custom domain, which would
      # redirect the preview to a domain whose DNS still points at the old
      # WordPress host — making the site look broken.
      - name: Match the custom domain to the path prefix
        run: |
          prefix="${PATH_PREFIX:-/}"
          echo "PATH_PREFIX -> ${prefix}"

          if [ "${prefix}" = "/" ]; then
            test -f _site/CNAME || { echo "::error::_site/CNAME is missing"; exit 1; }
            echo "serving at the domain root; CNAME -> $(cat _site/CNAME)"
          else
            rm -f _site/CNAME
            echo "::warning::Preview build under ${prefix} — CNAME withheld so \
          the custom domain stays unset. Set PATH_PREFIX to \"/\" in \
          .github/workflows/deploy.yml at the DNS cutover."
          fi

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
