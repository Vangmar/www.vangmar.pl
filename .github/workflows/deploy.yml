name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Allows a deploy to be triggered by hand from the Actions tab.
  workflow_dispatch:

# Read the repository, and mint the token the Pages deployment needs.
permissions:
  contents: read
  pages: write
  id-token: write

# A queued run waits for the one in progress rather than cancelling it, so a
# deploy that is already publishing is never interrupted half-way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the site
        run: npm run build

      # CNAME must survive into the published artifact or GitHub Pages drops the
      # custom domain; it is copied from src/ by the Eleventy build, so fail loudly
      # here rather than discovering the domain has reset after deploying.
      - name: Verify the custom domain file
        run: |
          test -f _site/CNAME || { echo "::error::_site/CNAME is missing"; exit 1; }
          echo "CNAME -> $(cat _site/CNAME)"

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
